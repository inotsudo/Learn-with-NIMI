<style>/* NIMIPIKO app shell — shown by the native app before/without the web app. */ :root { color-scheme: dark; } * { box-sizing: border-box; margin: 0; } html, body { height: 100%; } body { display: grid; place-items: center; overflow: hidden; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); font-family: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif; color: #FFF7E0; text-align: center; background: radial-gradient(120% 90% at 50% 35%, #1A3558 0%, #0B1A33 45%, #06101F 100%); -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; } .stage { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 24px; } .medal { position: relative; width: min(56vw, 56vh, 320px); aspect-ratio: 1; animation: float 4s ease-in-out infinite; } .medal img { width: 100%; height: 100%; border-radius: 50%; display: block; box-shadow: 0 0 0 6px #C9A84C, 0 0 0 9px rgba(253, 230, 138, 0.35), 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 80px rgba(253, 230, 138, 0.35); } .title { font-size: clamp(20px, 5vw, 30px); font-weight: 800; letter-spacing: 0.18em; color: #E8BC56; } .sub { font-size: clamp(14px, 3.6vw, 18px); font-weight: 700; opacity: 0.85; max-width: 26em; line-height: 1.35; } .dots span { display: inline-block; width: 10px; height: 10px; margin: 0 5px; border-radius: 50%; background: #FDE68A; animation: blink 1.2s infinite; } .dots span:nth-child(2) { animation-delay: 0.2s; } .dots span:nth-child(3) { animation-delay: 0.4s; } .btn { margin-top: 6px; min-height: 64px; min-width: 64px; padding: 0 30px; border: 0; border-radius: 999px; font: inherit; font-size: 19px; font-weight: 800; color: #06101F; background: radial-gradient(circle at 35% 30%, #FFF7E0, #FDE68A 40%, #D4A830 85%); box-shadow: 0 8px 0 rgba(120, 82, 18, 0.55), 0 0 40px rgba(253, 230, 138, 0.5); } .btn:active { transform: translateY(4px) scale(0.97); box-shadow: 0 4px 0 rgba(120, 82, 18, 0.55); } .dust { position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(2px 2px at 20% 30%, #FDE68A, transparent), radial-gradient(1.5px 1.5px at 70% 20%, #FFF7E0, transparent), radial-gradient(2px 2px at 85% 65%, #FDE68A, transparent), radial-gradient(1.5px 1.5px at 35% 80%, #FFF7E0, transparent), radial-gradient(2px 2px at 55% 50%, #FDE68A, transparent); opacity: 0.55; animation: rise 9s linear infinite; } @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } } @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } } @keyframes rise { from { transform: translateY(20px); } to { transform: translateY(-20px); } } @media (prefers-reduced-motion: reduce) { .medal, .dust, .dots span { animation: none; } } </style>
